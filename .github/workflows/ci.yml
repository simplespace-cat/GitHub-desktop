name: Build GitCub
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag / commit to build (defaults to latest GitCub commit)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: 20.18.1
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ELECTRON_BUILDER_SKIP_SIGNING: 'true'

jobs:
  build:
    name: ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, windows-2019]
        arch: [x64, arm64]
        include:
          - os: macos-13
            friendlyName: macOS
          - os: windows-2019
            friendlyName: Windows
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'GitCub' }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install and build dependencies
        run: yarn
        env:
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH:   ${{ matrix.arch }}

      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          yarn install
          yarn test

      - name: Build production app
        run: yarn build:prod
        env:
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH:   ${{ matrix.arch }}

      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Run unit tests
        if: |
          (runner.os == 'Windows' && matrix.arch == 'x64') ||
          (runner.os == 'macOS'  && matrix.arch == 'arm64')
        run: yarn test:unit

      - name: Run script tests
        run: yarn test:script

      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Show dist contents
        run: ls -R dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.friendlyName }}-${{ matrix.arch }}
          path: |
            dist/**/*.zip
            dist/**/*.exe
            !dist/**/GitHubDesktop-*/**
            !dist/**/*.msi
            !dist/**/*.nupkg
            !dist/**/bundle-size.json
          if-no-files-found: error        
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*